[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folman"
version = "0.1.0"
description = "FOLMAN - Fast, modular desktop file manager and automated folder organization engine"
authors = [ { name = "P20000", email = "" } ]
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]

